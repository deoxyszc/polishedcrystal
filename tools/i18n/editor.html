header button{color:#23382f;background:#fff;border-color:#ccd5ce}header button:hover{color:#154f34;background:#eaf1eb}</style><header><h1>本地化工作台</h1><span>原文 / 译文</span><button id=openFolder>打开资源文件夹</button><button id=importFolder>导入文件夹</button><input id=folderInput type=file webkitdirectory multiple hidden><button id=download>导出 CSV</button><button id=exportImages>导出新增图片</button><select id=uiLanguage aria-label=Interface-language><option value=zh-Hans>简体中文</option><option value=en>English</option></select></header><div class=workspace><aside><strong>标签</strong><div id=tags></div><small>文本、图片为内置标签</small></aside><main><div class=toolbar><input id=search placeholder=搜索原文、译文或路径><select id=language aria-label=翻译语言></select><select id=progress aria-label=翻译进度><option value=>全部进度</option><option value=empty>未填写</option><option value=filled>已填写</option></select><button id=saveAll class=primary>保存全部修改</button></div><div class=scroll id=scroll><table><thead><tr><th>原文</th><th id=targetHeading>译文</th></tr></thead><tbody id=body></tbody></table><p id=empty hidden>没有匹配资源。</p></div><footer><button id=prev>上一页</button><span id=count></span><button id=next>下一页</button><span id=status role=status></span></footer></main><section class=drawer id=drawer hidden><button id=close>关闭详情</button><h2>资源详情</h2><p id=source></p><small id=identity></small><label>标签</label><div id=rowTags class=taglist></div><input id=newTag placeholder=输入标签后按回车 list=tagNames><datalist id=tagNames></datalist><small>点击自定义标签移除；内置标签不可移除。</small><label>是否需要翻译</label><select id=decision><option value=review>待判断</option><option value=yes>需要翻译</option><option value=no>无需翻译</option></select><label>备注</label><textarea id=notes></textarea><p><button id=saveDetail class=primary>保存此资源</button></p><small>标签和审核标注在各语言间共享，不改变构建回退规则。</small></section></div><script>const UI_EN={"本地化工作台": "Localization editor", "原文 / 译文": "Source / Translation", "打开资源文件夹": "Open resource folder", "导入文件夹": "Import folder", "导出 CSV": "Export CSV", "没有新增图片": "No new images", "缺少语言列": "Missing language columns", "译文 ": "Translation ", "译文 · ": "Translation · ", "详情 / 标签": "Details / tags", "请选择 PNG": "Choose a PNG image", "选择直接包含 translations.csv 的套装目录": "Choose the folder directly containing translations.csv", "重复 ID": "Duplicate ID"};let uiLocale=localStorage.getItem("editor.uiLocale")||"zh-Hans";function ui(key){return uiLocale==="en"?(UI_EN[key]||key):key}function tagLabel(tag){return tag==="文本"||tag==="图片"?ui(tag):tag}
const uiNodes=[],uiAttrs=[];function setupUI(){const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){if(node.parentElement.closest("script,style"))continue;const key=node.textContent.trim();if(UI_EN[key])uiNodes.push([node,key])}for(const el of document.querySelectorAll("[placeholder],[aria-label]"))for(const attr of ["placeholder","aria-label"]){const key=el.getAttribute(attr);if(UI_EN[key])uiAttrs.push([el,attr,key])}}function applyUI(){document.documentElement.lang=uiLocale;document.title=ui("本地化工作台");for(const [node,key] of uiNodes)node.textContent=ui(key);for(const [el,attr,key] of uiAttrs)el.setAttribute(attr,ui(key))}

const $=id=>document.getElementById(id);let rows=[],languages=[],lang='',activeTag='',page=0,selected=null;const drafts=new Map(),pageSize=40;const built=r=>r.resource_kind==='image'?'图片':'文本';function view(r){return {...r,...drafts.get(r.id)}}function custom(r){let values=[];try{values=JSON.parse(r.tags||'[]')}catch{}if(!Array.isArray(values))values=[];return [...new Set([...values,...(r.category?[r.category]:[])])].filter(t=>typeof t==='string'&&t!=='文本'&&t!=='图片')}function rowTags(r){return [built(r),...custom(r)]}function change(r,fields){drafts.set(r.id,{...drafts.get(r.id),...fields});$('status').textContent=drafts.size+ui(" 项未保存");const s=document.getElementById('state-'+rows.indexOf(r));if(s)s.textContent=ui("未保存")}function asset(path){return '/asset/'+path.split('/').map(encodeURIComponent).join('/')}function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function tagMenu(){const counts=new Map();for(const r of rows)for(const t of rowTags(view(r)))counts.set(t,(counts.get(t)||0)+1);$('tags').replaceChildren();$('tagNames').replaceChildren();for(const t of ['', '文本','图片',...[...counts.keys()].filter(t=>t!=='文本'&&t!=='图片').sort()]){const b=element('button',(t?tagLabel(t):ui("全部"))+' '+(t?counts.get(t)||0:rows.length),activeTag===t?'active':'');b.onclick=()=>{activeTag=t;page=0;render()};$('tags').append(b);if(t){const o=element('option');o.value=t;$('tagNames').append(o)}}}function matches(){const q=$('search').value.toLowerCase();return rows.filter(row=>{const r=view(row),text=r['translation_'+lang]||'';return (!activeTag||rowTags(r).includes(activeTag))&&(!$('progress').value||Boolean(text.trim())===($('progress').value==='filled'))&&[r.original,text,r.source_path,r.notes,...rowTags(r)].some(x=>(x||'').toLowerCase().includes(q))})}function render(){tagMenu();const result=matches();page=Math.max(0,Math.min(page,Math.ceil(result.length/pageSize)-1));$('body').replaceChildren();$('targetHeading').textContent=ui("译文 · ")+lang;$('count').textContent=result.length+ui(" 项 · ")+(page+1)+' / '+Math.max(1,Math.ceil(result.length/pageSize));$('prev').disabled=page===0;$('next').disabled=(page+1)*pageSize>=result.length;$('empty').hidden=!!result.length;for(const r of result.slice(page*pageSize,(page+1)*pageSize)){const v=view(r),tr=element('tr',undefined,selected===r?'selected':''),left=element('td'),right=element('td'),meta=element('div',undefined,'rowmeta');for(const t of rowTags(v)){const chip=element('button',tagLabel(t),'chip');chip.onclick=()=>{activeTag=t;page=0;render()};meta.append(chip)}const info=element('button',ui("详情 / 标签"),'info');info.onclick=()=>openDetails(r);meta.append(info);left.append(meta);if(r.resource_kind==='text'){left.append(element('div',r.original,'original'));const input=element('textarea',undefined,'translation');input.value=v['translation_'+lang]||'';input.setAttribute('aria-label',ui("译文 ")+r.id);const targetLanguage=lang;input.oninput=()=>change(r,{['translation_'+targetLanguage]:input.value});input.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();save(r).then(ok=>{if(ok)render()})}};right.append(input)}else{const original=element('img',undefined,'image');original.src=asset(r.original);original.alt=r.source_path;original.loading='lazy';left.append(original);const replacement=element('img',undefined,'image'),path=element('input',undefined,'path');replacement.alt=ui("替换图");path.value=v['translation_'+lang]||'';path.placeholder=ui("替换图片路径；留空保留原图");const preview=()=>{replacement.hidden=!path.value;if(path.value)replacement.src=asset(path.value)};preview();const targetLanguage=lang;path.oninput=()=>{change(r,{['translation_'+targetLanguage]:path.value});preview()};const drop=element('div',ui("拖放 / 粘贴 PNG，或选择图片"),'drop');drop.tabIndex=0;const file=element('input');file.type='file';file.accept='image/png';file.onchange=()=>upload(r,file.files[0],targetLanguage);drop.append(file);drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();upload(r,e.dataTransfer.files[0],targetLanguage)};drop.onpaste=e=>{const item=[...e.clipboardData.items].find(x=>x.type==='image/png');if(item){e.preventDefault();upload(r,item.getAsFile(),targetLanguage)}};right.append(replacement,drop,path)}const actions=element('div',undefined,'rowactions'),button=element('button',ui("保存")),status=element('span',drafts.has(r.id)?ui("未保存"):'','rowstatus');status.id='state-'+rows.indexOf(r);button.onclick=()=>save(r).then(ok=>{if(ok)render()});actions.append(button,status);right.append(actions);tr.append(left,right);$('body').append(tr)}}function detailTags(){const v=view(selected);$('rowTags').replaceChildren();for(const t of rowTags(v)){const b=element('button',tagLabel(t)+(t===built(selected)?'':' ×'),'chip');b.disabled=t===built(selected);b.onclick=()=>{change(selected,{tags:JSON.stringify(custom(view(selected)).filter(x=>x!==t)),category:''});detailTags();render()};$('rowTags').append(b)}}function openDetails(r){selected=r;const v=view(r);$('drawer').hidden=false;$('source').textContent=r.source_path;$('identity').textContent=r.id+' · '+r.review_status;$('decision').value=v.needs_translation||'review';$('notes').value=v.notes||'';$('newTag').value='';detailTags();render()}$('newTag').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const t=e.target.value.trim();if(!t||t==='文本'||t==='图片')return;if(t.length>80){$('status').textContent=ui("标签最多 80 字");return}change(selected,{tags:JSON.stringify([...new Set([...custom(view(selected)),t])]),category:''});e.target.value='';detailTags();render()}};$('decision').onchange=()=>change(selected,{needs_translation:$('decision').value});$('notes').oninput=()=>change(selected,{notes:$('notes').value});$('close').onclick=()=>{$('drawer').hidden=true;selected=null;render()};$('saveDetail').onclick=()=>save(selected).then(ok=>{if(ok)render()});$('saveAll').onclick=async()=>{for(const id of [...drafts.keys()]){if(!await save(rows.find(r=>r.id===id)))return}render()};$('search').oninput=$('progress').onchange=()=>{page=0;render()};$('language').onchange=()=>{lang=$('language').value;render()};$('prev').onclick=()=>{page--;render();$('scroll').scrollTop=0};$('next').onclick=()=>{page++;render();$('scroll').scrollTop=0};window.addEventListener('beforeunload',e=>{if(drafts.size){e.preventDefault();e.returnValue=''}});let folderHandle=null,csvHeaders=[],loadedCSV='';const files=new Map(),objectURLs=new Map(),uploads=new Map();
function parseCSV(text){text=text.replace(/^﻿/,'');const result=[];let row=[],value='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){value+='"';i++}else quoted=false}else value+=c}else if(c==='"')quoted=true;else if(c===','){row.push(value);value=''}else if(c==='\n'||c==='\n'){if(c==='\n'&&text[i+1]==='\n')i++;row.push(value);result.push(row);row=[];value=''}else value+=c}if(quoted)throw Error(ui("CSV 引号未结束"));if(value||row.length){row.push(value);result.push(row)}return result}
function serialize(data){const quote=v=>String.fromCharCode(34)+String(v??'').replaceAll(String.fromCharCode(34),String.fromCharCode(34,34))+String.fromCharCode(34);return '﻿'+[csvHeaders,...data.map(r=>csvHeaders.map(f=>r[f]||''))].map(row=>row.map(quote).join(',')).join('\n')+'\n'}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function safe(path){if(path.startsWith('/')||path.includes('..')||path.includes(':')||path.includes(String.fromCharCode(92)))throw Error(ui("无效路径"));return path}
asset=function(path){try{safe(path)}catch{return ''}if(objectURLs.has(path))return objectURLs.get(path);const file=files.get(path);if(!file)return '';const url=URL.createObjectURL(file);objectURLs.set(path,url);return url};
async function writeLocal(path,data){const parts=safe(path).split('/');let handle=folderHandle;for(const name of parts.slice(0,-1))handle=await handle.getDirectoryHandle(name,{create:true});const file=await handle.getFileHandle(parts.at(-1),{create:true}),writer=await file.createWritable();await writer.write(data);await writer.close()}
async function loadPackage(incoming,handle=null){const file=incoming.get('translations.csv');if(!file)throw Error(ui("选择直接包含 translations.csv 的套装目录"));const text=await file.text(),table=parseCSV(text),headers=table.shift();if(!headers||new Set(headers).size!==headers.length||!['id','original','source_path','resource_kind'].every(k=>headers.includes(k)))throw Error(ui("CSV 表头无效"));const parsed=table.map(values=>{if(values.length!==headers.length)throw Error(ui("CSV 列数错误"));return Object.fromEntries(headers.map((k,i)=>[k,values[i]]))});if(new Set(parsed.map(r=>r.id)).size!==parsed.length)throw Error(ui("重复 ID"));const langs=headers.filter(k=>k.startsWith('translation_')).map(k=>k.slice(12));if(!langs.length)throw Error(ui("缺少语言列"));for(const url of objectURLs.values())URL.revokeObjectURL(url);objectURLs.clear();files.clear();uploads.clear();for(const pair of incoming)files.set(...pair);folderHandle=handle;loadedCSV=text;csvHeaders=[...headers,...['tags','category','notes','needs_translation'].filter(k=>!headers.includes(k))];rows=parsed;languages=langs;lang=langs[0];drafts.clear();page=0;activeTag='';selected=null;$('drawer').hidden=true;$('language').replaceChildren();for(const t of langs){const o=element('option',t);o.value=t;$('language').append(o)}render();$('status').textContent=handle?ui("已打开，可直接保存到文件夹"):ui("兼容模式：使用导出 CSV 和导出图片保存")}
async function collect(handle,prefix='',result=new Map()){for await(const [name,child] of handle.entries()){const path=prefix+name;if(child.kind==='directory')await collect(child,path+'/',result);else if(path==='translations.csv'||path.endsWith('.png'))result.set(path,await child.getFile())}return result}
async function save(r){const changes=drafts.get(r.id);if(!changes)return true;if(!folderHandle){$('status').textContent=ui("兼容模式请使用顶部导出 CSV，包含全部未保存修改");return false}try{const file=await folderHandle.getFileHandle('translations.csv');if(await(await file.getFile()).text()!==loadedCSV)throw Error(ui("CSV 已被外部修改，请先导出当前修改，再重新打开"));for(const [path,blob] of uploads)await writeLocal(path,blob);const text=serialize(rows.map(row=>row.id===r.id?{...row,...changes}:row));await writeLocal('translations.csv',text);loadedCSV=text;Object.assign(r,changes);if(drafts.get(r.id)===changes)drafts.delete(r.id);$('status').textContent=drafts.size?drafts.size+ui(" 项未保存"):ui("已保存");return true}catch(e){$('status').textContent=ui("保存失败：")+e.message;return false}};
async function upload(r,file,targetLanguage){if(!file)return;try{const signature=new Uint8Array(await file.slice(0,8).arrayBuffer());if(signature.join(',')!=='137,80,78,71,13,10,26,10')throw Error(ui("请选择 PNG"));const bitmap=await createImageBitmap(file);bitmap.close();const path='replacements/'+crypto.randomUUID()+'.png';files.set(path,file);uploads.set(path,file);change(r,{['translation_'+targetLanguage]:path});render()}catch(e){$('status').textContent=e.message}};
$('openFolder').onclick=async()=>{if(drafts.size&&!confirm(ui("放弃未保存修改？")))return;if(!window.showDirectoryPicker){$('folderInput').click();return}try{const handle=await showDirectoryPicker({mode:'readwrite'});await loadPackage(await collect(handle),handle)}catch(e){if(e.name!=='AbortError')$('status').textContent=e.message}};
$('importFolder').onclick=()=>$('folderInput').click();$('folderInput').onchange=async e=>{if(drafts.size&&!confirm(ui("放弃未保存修改？")))return;try{const map=new Map();for(const f of e.target.files)map.set(f.webkitRelativePath.split('/').slice(1).join('/'),f);await loadPackage(map)}catch(e){$('status').textContent=e.message}};
$('download').onclick=()=>{if(!rows.length)return;download(new Blob([serialize(rows.map(view))],{type:'text/csv;charset=utf-8'}),'translations.csv');$('status').textContent=ui("CSV 已导出；新增图片需另行导出到 replacements 文件夹")};
$('exportImages').onclick=()=>{for(const [path,file] of uploads)download(file,path.split('/').at(-1));$('status').textContent=uploads.size?ui("把下载图片放入套装的 replacements 文件夹"):ui("没有新增图片")};
$('status').textContent=ui("打开资源文件夹开始工作，无需服务或联网");
setupUI();$("uiLanguage").value=uiLocale;$("uiLanguage").onchange=()=>{uiLocale=$("uiLanguage").value;localStorage.setItem("editor.uiLocale",uiLocale);applyUI();render();if(selected)detailTags()};applyUI();</script></html>
