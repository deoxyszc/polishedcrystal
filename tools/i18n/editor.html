async function loadPackage(incoming,handle=null){const file=incoming.get('translations.csv');if(!file)throw Error(ui("选择直接包含 translations.csv 的套装目录"));const text=await file.text(),table=parseCSV(text),headers=table.shift();if(!headers||new Set(headers).size!==headers.length||!['id','original','source_path','resource_kind'].every(k=>headers.includes(k)))throw Error(ui("CSV 表头无效"));const parsed=table.map(values=>{if(values.length!==headers.length)throw Error(ui("CSV 列数错误"));return Object.fromEntries(headers.map((k,i)=>[k,values[i]]))});if(new Set(parsed.map(r=>r.id)).size!==parsed.length)throw Error(ui("重复 ID"));const langs=headers.filter(k=>k.startsWith('translation_')).map(k=>k.slice(12));if(!langs.length)throw Error(ui("缺少语言列"));for(const url of objectURLs.values())URL.revokeObjectURL(url);objectURLs.clear();files.clear();uploads.clear();for(const pair of incoming)files.set(...pair);folderHandle=handle;loadedCSV=text;csvHeaders=[...headers,...['tags','category','notes','needs_translation','contains_text'].filter(k=>!headers.includes(k))];rows=parsed;languages=langs;lang=langs[0];drafts.clear();page=0;activeTag=[];selected=null;$('drawer').hidden=true;$('language').replaceChildren();for(const t of langs){const o=element('option',t);o.value=t;$('language').append(o)}render();$('status').textContent=handle?ui("已打开，可直接保存到文件夹"):ui("兼容模式：使用导出保存")}
async function collect(handle,prefix='',result=new Map()){for await(const [name,child] of handle.entries()){const path=prefix+name;if(child.kind==='directory')await collect(child,path+'/',result);else if(path==='translations.csv'||path.endsWith('.png'))result.set(path,await child.getFile())}return result}
async function save(r){const changes=drafts.get(r.id);if(!changes)return true;if(!folderHandle){$('status').textContent=ui("请先打开资源文件夹");return false}try{const file=await folderHandle.getFileHandle('translations.csv');if(await(await file.getFile()).text()!==loadedCSV)throw Error(ui("CSV 已被外部修改，请先保留当前编辑内容再重新打开文件夹"));for(const [path,blob] of uploads)await writeLocal(path,blob);const text=serialize(rows.map(row=>row.id===r.id?{...row,...changes}:row));await writeLocal('translations.csv',text);loadedCSV=text;Object.assign(r,changes);if(drafts.get(r.id)===changes)drafts.delete(r.id);$('status').textContent=drafts.size?drafts.size+ui(" 项未保存"):ui("已保存");return true}catch(e){$('status').textContent=ui("保存失败：")+e.message;return false}};
async function upload(r,file,targetLanguage){if(!file)return;try{const signature=new Uint8Array(await file.slice(0,8).arrayBuffer());if(signature.join(',')!=='137,80,78,71,13,10,26,10')throw Error(ui("请选择 PNG"));const bitmap=await createImageBitmap(file);bitmap.close();const path='replacements/'+crypto.randomUUID()+'.png';files.set(path,file);uploads.set(path,file);change(r,{['translation_'+targetLanguage]:path});render()}catch(e){$('status').textContent=e.message}};
function folderDB(){return new Promise((resolve,reject)=>{const request=indexedDB.open('localization-folders',1);request.onupgradeneeded=()=>request.result.createObjectStore('handles');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
async function storedFolder(key,value){const db=await folderDB();try{return await new Promise((resolve,reject)=>{const transaction=db.transaction('handles',value?'readwrite':'readonly'),store=transaction.objectStore('handles'),request=value?store.put(value,key):store.get(key);transaction.oncomplete=()=>resolve(request.result);transaction.onerror=()=>reject(transaction.error);transaction.onabort=()=>reject(transaction.error)})}finally{db.close()}}
let rememberedFolder=null;async function rememberFolder(handle){try{const url=new URL(location.href),existing=url.searchParams.get('folder');let key=existing;if(key){const previous=await storedFolder(key);if(!previous||!await previous.isSameEntry(handle))key=null}key=key||crypto.randomUUID();await storedFolder(key,handle);url.searchParams.set('folder',key);url.searchParams.set('path',handle.name);history.replaceState(null,'',url)}catch(error){$('status').textContent=ui('文件夹已打开，但浏览器未能记住它')}}
async function restoreFolder(){const key=new URL(location.href).searchParams.get('folder');if(!key)return;try{const handle=await storedFolder(key);if(!handle){$('status').textContent=ui('未找到已记住的目录，请打开一次资源文件夹');return}rememberedFolder=handle;if(await handle.queryPermission({mode:'readwrite'})==='granted'){await loadPackage(await collect(handle),handle)}else{$('status').textContent=ui('点击打开资源文件夹即可恢复上次目录，无需重新选择')}}catch(error){$('status').textContent=ui('无法恢复目录，请重新打开资源文件夹')}}
$('openFolder').onclick=async()=>{if(drafts.size&&!confirm(ui('放弃未保存修改？')))return;if(!window.showDirectoryPicker){$('status').textContent=ui('此浏览器不支持直接修改文件夹，请使用 Chrome 或 Edge 打开此页面');return}try{let handle;if(rememberedFolder&&!folderHandle&&await rememberedFolder.requestPermission({mode:'readwrite'})==='granted')handle=rememberedFolder;else handle=await showDirectoryPicker({mode:'readwrite'});await loadPackage(await collect(handle),handle);rememberedFolder=handle;await rememberFolder(handle)}catch(e){if(e.name!=='AbortError')$('status').textContent=ui('打开文件夹失败：')+e.message}};
window.addEventListener("resize",()=>document.querySelectorAll("textarea.translation").forEach(fitTranslation));let imageScale=1,zoomReturnFocus=null;function setImageScale(scale){imageScale=Math.max(0.05,Math.min(16,scale));const image=$('zoomImage');image.style.width=Math.round(image.naturalWidth*imageScale)+'px';image.style.height=Math.round(image.naturalHeight*imageScale)+'px';$('zoomScale').textContent=Math.round(imageScale*100)+'%'}function fitImage(){const stage=$('zoomStage'),image=$('zoomImage');if(image.naturalWidth)setImageScale(Math.min(stage.clientWidth/image.naturalWidth,stage.clientHeight/image.naturalHeight,8))}function openImage(image){if(!image.src||image.hidden)return;zoomReturnFocus=document.activeElement;const preview=$('zoomImage');$('zoomCaption').textContent=image.alt;preview.alt=image.alt;preview.onload=fitImage;preview.src=image.src;$('imageZoom').showModal();if(preview.complete)fitImage();$('zoomClose').focus()}$('body').addEventListener('click',event=>{if(event.target.matches('img.image'))openImage(event.target)});$('body').addEventListener('keydown',event=>{if(event.target.matches('img.image')&&(event.key==='Enter'||event.key===' ')){event.preventDefault();openImage(event.target)}});$('zoomClose').onclick=()=>$('imageZoom').close();$('zoomIn').onclick=()=>setImageScale(imageScale*1.5);$('zoomOut').onclick=()=>setImageScale(imageScale/1.5);$('zoomActual').onclick=()=>setImageScale(1);$('zoomFit').onclick=fitImage;$('imageZoom').addEventListener('close',()=>{if(zoomReturnFocus?.isConnected)zoomReturnFocus.focus()});
