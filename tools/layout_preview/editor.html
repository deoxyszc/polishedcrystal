<!doctype html><html lang=zh><meta charset=utf-8><title>粉页像素排版台</title><style>body{background:#172331;color:#e5eff8;font:15px system-ui;margin:24px}h1{font-size:22px}main{display:flex;gap:24px}aside{width:250px;background:#24364a;padding:18px;border-radius:10px}label{display:block;margin:12px 0}input,button,select{font:inherit;padding:6px;max-width:220px}button{cursor:pointer;margin:4px;background:#387b99;color:white;border:0;border-radius:4px}input[type=number]{width:60px}canvas{image-rendering:pixelated;touch-action:none;width:640px;height:576px}#stage{position:relative;width:640px;height:576px}#overlay{position:absolute;inset:0}small{display:block;line-height:1.6;color:#b2cadd}#status{color:#ffcc77;white-space:pre-wrap}</style>
<h1>粉色详情页 · 像素排版试验台</h1><p>真实ROM截图与字模；编辑结果为布局模拟。原始分辨率160×144，4倍最近邻显示。</p><main><aside><label>新增文字<input id=entry value=经验403></label><button id=add>添加文字</button><label><input id=clean type=checkbox> 只显示无文字底板</label><small>已拆出上方文字、页签文字、底部数值和完整经验条；边框保留在底板。</small><label><input id=grid type=checkbox checked> 8px网格</label><label><input id=boxes type=checkbox checked> 选中元素占格</label><label><input id=original type=checkbox> 只看原图</label><label>吸附<select id=snap><option value=1>1px</option><option value=4>4px</option><option value=8>8px</option></select></label><button id=undo>撤销</button><button id=reset>重置</button><hr><div id=list></div></aside><section><div id=stage><canvas id=screen width=160 height=144></canvas><canvas id=overlay width=160 height=144></canvas></div><p id=status></p><small>ROM约束模式：可动元素按8px定位，固定元素已锁定。蓝框为选中元素，绿格为可见像素覆盖，橙格为文字写入模拟。</small></section><aside><b>元素参数</b><pre id=occupancy style=white-space:pre-wrap;font-size:13px></pre><label>文字<input id=text></label><label>X <input id=x type=number> Y <input id=y type=number></label><label>汉字偏移 <input id=cjk type=number min=0 max=4></label><label>数字偏移 <input id=latin type=number min=0 max=8></label><label>字色<input id=color type=color value=#000000></label><label><input id=opaque type=checkbox> 模拟不透明单元覆盖</label><button id=del>删除元素</button><hr><button id=png>导出预览PNG</button><button id=transparent>导出透明文字PNG</button><button id=export>导出布局JSON</button><button id=import>导入布局JSON</button><input id=file type=file accept=.json hidden><small>保留1px坐标和真实字模；JSON尚未自动写回ASM。原图元素可拖动；编辑其文字会转换为真实字模文本。</small></aside></main>
<script>
/*TILE_GEOMETRY*/
const DATA=/*PACKAGED_DATA*/null;
const $=id=>document.getElementById(id),cv=$('screen'),ctx=cv.getContext('2d'),ui=$('overlay'),ux=ui.getContext('2d');let items=structuredClone(DATA.elements),sel=-1,history=[],drag=null;const raw=Uint8Array.from(atob(DATA.rgb),x=>x.charCodeAt(0)),base=ctx.createImageData(160,144);for(let i=0;i<23040;i++){base.data.set(raw.subarray(i*3,i*3+3),i*4);base.data[i*4+3]=255}const pink='#'+Array.from(raw.slice((130*160+150)*3,(130*160+150)*3+3)).map(n=>n.toString(16).padStart(2,'0')).join('');
const background=ctx.createImageData(160,144),bgraw=Uint8Array.from(atob(DATA.background),c=>c.charCodeAt(0));for(let i=0;i<23040;i++){background.data.set(bgraw.subarray(i*3,i*3+3),i*4);background.data[i*4+3]=255}
const imageCache=new Map();function imageOf(e){if(!imageCache.has(e.rgba)){let c=document.createElement('canvas');c.width=e.w;c.height=e.h;let t=c.getContext('2d'),d=t.createImageData(e.w,e.h);d.data.set(Uint8Array.from(atob(e.rgba),c=>c.charCodeAt(0)));t.putImageData(d,0,0);imageCache.set(e.rgba,c)}return imageCache.get(e.rgba)}function height(e){return e.type==='image'?e.h:16}
/*CONSTRAINTS*/
function save(){history.push(JSON.stringify({items,sel,clean:$('clean').checked}));if(history.length>80)history.shift()}function width(e){if(e.type==='image')return e.w;return [...e.text].reduce((n,c)=>n+(DATA.glyphs[c]?.w||12),0)}
function paint(c,e,dx=0,dy=0){let x=e.x+dx,y=e.y+dy;if(e.type==='image'){c.drawImage(imageOf(e),x,y);return}if(e.opaque){c.fillStyle=pink;c.fillRect(x,y,Math.ceil(width(e)/8)*8,16)}c.fillStyle=e.color;for(let ch of e.text){let g=DATA.glyphs[ch];if(!g){c.strokeStyle='red';c.strokeRect(x+.5,y+.5,11,11);x+=12;continue}for(let yy=0;yy<g.h;yy++)for(let xx=0;xx<g.w;xx++)if(g.pixels[yy*g.w+xx])c.fillRect(x+xx,y+yy+(g.h===12?e.cjk:e.latin),1,1);x+=g.w}}
function render(){ctx.putImageData($('original').checked?base:background,0,0);ux.clearRect(0,0,160,144);let warnings=[];if(!$('original').checked){if(!$('clean').checked)items.forEach((e,i)=>{paint(ctx,e);if(e.x<0||e.y<0||e.x+width(e)>160||e.y+height(e)>144)warnings.push('越界：'+e.text);let missing=e.type==='image'?[]:[...e.text].filter(c=>!DATA.glyphs[c]);if(missing.length)warnings.push('缺字：'+missing.join(''));if(i===sel){ux.strokeStyle='#08b7e4';ux.lineWidth=.8;ux.strokeRect(e.x,e.y,width(e),height(e))}})}if($('grid').checked){ux.strokeStyle='#1976a655';ux.lineWidth=.3;ux.beginPath();for(let x=0;x<=160;x+=8){ux.moveTo(x,0);ux.lineTo(x,144)}for(let y=0;y<=144;y+=8){ux.moveTo(0,y);ux.lineTo(160,y)}ux.stroke()}showOccupancy();$('status').textContent=warnings.join(String.fromCharCode(10))||'像素预览就绪；背景中的原元素需人工判断覆盖。'}

function showOccupancy(){
 const e=items[sel];if(!e){$('occupancy').textContent='选择元素查看图块覆盖';return}
 const o=occupancy(e,DATA.glyphs),nl=String.fromCharCode(10);
 let text='可见像素覆盖：'+o.visible.cells.length+'格'+nl+'外接区域覆盖：'+o.cropCells.length+'格'+nl;
 text+=o.writeCells?'16px写入模拟：'+o.writeCells.length+'格'+nl:'原图元素：实际写入范围未知'+nl;
 text+='VRAM分配：未知，未读取tilemap/OAM及缓存';
 if(!o.alignment)text+=nl+'非8px对齐：当前ROM入口需适配，不能直接使用此坐标。';
 if(o.missing.length)text+=nl+'存在缺字，像素覆盖不完整。';
 if(o.visible.box){const b=o.visible.box;text+=nl+'墨迹框 x,y,w,h：'+[b.x,b.y,b.w,b.h].join(',')}
 $('occupancy').textContent=text;
 if(!$('boxes').checked||$('original').checked||$('clean').checked)return;
 for(const [x,y] of o.writeCells||[]){ux.fillStyle='#f0a03135';ux.fillRect(x*8,y*8,8,8);ux.strokeStyle='#d88618';ux.lineWidth=.35;ux.strokeRect(x*8,y*8,8,8)}
 for(const [x,y] of o.visible.cells){ux.strokeStyle='#08a96b';ux.lineWidth=.6;ux.strokeRect(x*8+.7,y*8+.7,6.6,6.6)}
}
function refresh(){let e=items[sel];for(let k of ['text','x','y','cjk','latin','color','opaque']){let a=$(k);a.disabled=!e||['text','cjk','latin','color','opaque'].includes(k)||(['x','y'].includes(k)&&!!CONTRACT.fixed[e?.binding]);if(e){if(k==='opaque')a.checked=e[k];else a.value=e[k]}}$('list').replaceChildren();items.forEach((e,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+e.text;b.style.display='block';if(i===sel)b.style.outline='2px solid #60e2da';b.onclick=()=>{sel=i;refresh()};$('list').append(b)});render()}
$('add').disabled=true;$('del').disabled=true;$('snap').value='8';$('snap').disabled=true;$('add').onclick=()=>{save();items.push({text:$('entry').value,x:8,y:104,cjk:4,latin:8,color:'#000000',opaque:false});sel=items.length-1;refresh()};for(let k of ['text','x','y','cjk','latin','color','opaque'])$(k).onchange=()=>{if(sel<0)return;let e=items[sel];if(['x','y'].includes(k)){save();moveBound(e,k==='x'?+$(k).value:e.x,k==='y'?+$(k).value:e.y);refresh();return}save();if(k==='text'&&e.type==='image'){delete e.rgba;e.type='text';e.latin=0;e.cjk=0}e[k]=$(k).type==='number'?Math.round(+$(k).value):k==='opaque'?$(k).checked:$(k).value;if(k==='cjk')e[k]=Math.max(0,Math.min(4,e[k]));if(k==='latin')e[k]=Math.max(0,Math.min(8,e[k]));refresh()};
function pos(ev){let r=ui.getBoundingClientRect();return{x:Math.floor((ev.clientX-r.left)*160/r.width),y:Math.floor((ev.clientY-r.top)*144/r.height)}}ui.onpointerdown=ev=>{if($('original').checked)return;let p=pos(ev);sel=items.findLastIndex(e=>p.x>=e.x&&p.x<e.x+width(e)&&p.y>=e.y&&p.y<e.y+height(e));if(sel>=0){save();drag={x:p.x-items[sel].x,y:p.y-items[sel].y};ui.setPointerCapture(ev.pointerId)}refresh()};ui.onpointermove=ev=>{if(!drag)return;let p=pos(ev),n=+$('snap').value,e=items[sel];moveBound(e,p.x-drag.x,p.y-drag.y);refresh()};ui.onpointerup=ui.onpointercancel=()=>drag=null;document.onkeydown=ev=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;let d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[ev.key];if(d&&sel>=0){ev.preventDefault();save();let n=8;moveBound(items[sel],items[sel].x+d[0]*n,items[sel].y+d[1]*n);refresh()}};
$('undo').onclick=()=>{if(!history.length)return;let v=JSON.parse(history.pop());items=v.items;sel=v.sel;$('clean').checked=v.clean;refresh()};$('reset').onclick=()=>{save();items=structuredClone(DATA.elements);sel=-1;$('clean').checked=false;refresh()};$('del').onclick=()=>{if(sel<0)return;save();items.splice(sel,1);sel=-1;refresh()};for(let k of ['grid','boxes','original','clean'])$(k).onchange=render;
function download(name,blob){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('png').onclick=()=>cv.toBlob(b=>download('layout-preview.png',b));$('transparent').onclick=()=>{let e=items[sel];if(!e)return;let c=document.createElement('canvas');c.width=Math.max(1,width(e));c.height=height(e);paint(c.getContext('2d'),{...e,opaque:false},-e.x,-e.y);c.toBlob(b=>download('text-element.png',b))};$('export').onclick=()=>download('layout.json',new Blob([JSON.stringify({schema:1,provenance:DATA.provenance,clean:$('clean').checked,items,occupancy:items.map(e=>occupancy(e,DATA.glyphs))},null,2)],{type:'application/json'}));$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let v=JSON.parse(await $('file').files[0].text());if(v.schema!==1||JSON.stringify(v.provenance)!==JSON.stringify(DATA.provenance)||!Array.isArray(v.items)||v.items.length>100)throw Error('文件格式或来源不匹配');for(let e of v.items){if(e.type==='image'&&(!Number.isInteger(e.w)||!Number.isInteger(e.h)||e.w<1||e.w>160||e.h<1||e.h>144||typeof e.rgba!=='string'||atob(e.rgba).length!==e.w*e.h*4))throw Error('图片参数错误');if(typeof e.text!=='string'||e.text.length>500||![e.x,e.y,e.cjk,e.latin].every(Number.isInteger)||e.cjk<0||e.cjk>4||e.latin<0||e.latin>8)throw Error('元素参数错误')}validateRomItems(v.items);save();items=v.items;sel=-1;$('clean').checked=!!v.clean;refresh()}catch(e){$('status').textContent=e.message}};refresh();
/*ROM_EXPORT*/
</script></html>
